# Elgato Video Capture (Conexant cx231xx) audio node tuning.
#
# Two jobs:
#
#  1. Stop it winning default-source. Out of the box this capture card becomes
#     the system default microphone, which silently breaks voice chat -- you end
#     up transmitting whatever you are capturing instead of your voice.
#
#  2. Give ALSA a workable period size.
#
#     This originally asked for period-size 256 with zero headroom, chasing
#     latency. That was wrong for a USB capture device: samples arrive in
#     bursts tied to USB frames, not in a smooth stream, so a tiny period with
#     no headroom underruns constantly -- measured at 11,780 xruns on this
#     node while every other node on the system reported zero. The audio was
#     audibly broken as a result.
#
#     1024 with headroom still keeps latency low (about 21ms at 48kHz) and
#     leaves enough slack to absorb USB burstiness.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Elgato_Video_Capture.*" }
    ]
    actions = {
      update-props = {
        # Default sources sit around 1000+; 100 means this never wins.
        priority.session       = 100
        priority.driver        = 100
        node.description       = "Elgato Video Capture"
        api.alsa.period-size   = 1024
        api.alsa.headroom      = 1024
        api.alsa.disable-batch = false
      }
    }
  }
]
