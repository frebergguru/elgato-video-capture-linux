# Elgato Video Capture V2: the cx25840 decoder's horizontal time-lock loop is
# never programmed by the stock driver, so SAV-to-SAV line lengths hunt and
# roughly 60% of frames tear. elgato_htl applies the vendor HTL_CTRL/PLL_CTRL
# constants: measured, HTL_CTRL 0x00002040 -> 0x00000802 and PLL_CTRL
# 0x161f0300 -> 0x161f1000.
#
# 2 rather than 1 only because that is what was measured and what this file has
# always said. The two are identical in effect -- the lock-acquire routine that
# 2 was meant to add cannot run, and could not contribute if it did; see
# cx231xx_elgato_v2_acquire_lock() in driver/cx231xx/cx231xx-avcore.c.
#
# Measured 2026-08-24 against a chroma-coherence metric validated on frames
# inspected by eye: 0.0% of frames corrupt over 750 frames, against ~60% with
# elgato_htl=0. The other experiment knobs measured worse and stay off.
options cx231xx elgato_htl=2
