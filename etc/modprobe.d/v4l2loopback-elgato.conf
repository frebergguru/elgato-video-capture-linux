# One virtual capture node for "elgato-viewer --share" to publish on.
#
# The capture card is single-open -- cx231xx has one vb2_queue, so the second
# program to call STREAMON gets EBUSY. That is a property of the hardware and
# cannot be worked around. What can be done is to capture once and hand the
# frames to everyone: the viewer tees its pipeline into this loopback node, and
# OBS (or anything else) reads it as an ordinary camera.
#
#   video_nr=40       well clear of the built-in webcam (video0-3) and the
#                     card itself (video4), so the number never moves
#   card_label        the udev rule in 71-elgato-share.rules matches on this to
#                     create /dev/elgato-share
#   exclusive_caps=1  the node advertises CAPTURE only once a writer is
#                     attached. OBS and Chrome both need this to list it as a
#                     camera at all. The cost is an ordering rule: with no
#                     writer the node is an OUTPUT device, so start the viewer
#                     before OBS looks for it.
#   max_buffers=4     this is a live feed; queueing more only adds latency.
options v4l2loopback devices=1 video_nr=40 card_label="Elgato Share" exclusive_caps=1 max_buffers=4
